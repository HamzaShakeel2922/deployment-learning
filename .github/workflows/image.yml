name: image
on:
  push:
    branches:
      - main
jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: "actions/checkout@v4"
      
      - name: login to docker
        uses: "docker/login-action@v4"
        with: 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: build react image and push 
        uses: docker/build-push-action@v7
        with:
          context: ./react-app
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/docker-learning:react-v1.0
      
      - name: build backend image and push 
        uses: docker/build-push-action@v7
        with:
          context: ./weatherApi
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/docker-learning:backend-v1.0
    
        

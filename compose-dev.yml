services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: 
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql

  pgAdmin:
    image: dpage/pgadmin4
    ports: 
      - "80:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hawk.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
        - db                 
volumes:
  postgres_data: